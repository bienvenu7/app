name: Deploy to VPS

on:
  push:
    branches:
      - app
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (build only; bundle is from this ref)"
        required: false
        default: "app"

concurrency:
  group: deploy-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_DIR: /var/www/app
      TARGET_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # Actions are pinned to commit SHAs: a mutable tag could be repointed at
      # arbitrary code that runs with VPS_SSH_KEY in scope. Refresh with
      # `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan tracked files for secrets
        run: |
          set -euo pipefail
          # Scans the tree at this ref, not the history: commit 68342f8 still
          # holds a .env, so scanning history would block every deploy until
          # that history is rewritten.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git — secrets must stay out of the repository"
            exit 1
          fi

          PATTERN='eyJhbGciOi[A-Za-z0-9_-]{10,}|AKIA[0-9A-Z]{16}|sk_(live|test)_[A-Za-z0-9]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}'
          if git grep -n -I -E "${PATTERN}" -- . ':!package-lock.json' ':!pnpm-lock.yaml'; then
            echo "::error::Possible secret in tracked files — see the matches above"
            exit 1
          fi

          echo "No secrets found in tracked files."

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
          cache: "npm"

      - name: Telegram notify start
        env:
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets missing, skipping notification."
            exit 0
          fi
          MESSAGE="🚀 Deploy started
          Repo: ${REPO}
          Branch: ${TARGET_BRANCH}
          Actor: ${ACTOR}
          Run: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" >/dev/null

      - name: Install, build, pack standalone
        run: |
          set -euo pipefail
          npm ci
          npm run build
          if [ ! -d .next/standalone ]; then
            echo "Missing .next/standalone (is output: standalone in next.config?)" >&2
            exit 1
          fi
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -R deploy .next/standalone/
          echo "Bundle size (before tar):"
          du -sh .next/standalone
          tar -czf deploy.tar.gz -C .next/standalone .
          ls -la deploy.tar.gz

      - name: Upload apply script
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # strip_components: 0 garde le chemin source → cible = /var/www/app/deploy/artifact-apply.sh
          # (target .../deploy/ créait .../deploy/deploy/artifact-apply.sh)
          source: "deploy/artifact-apply.sh"
          target: /var/www/app/
          strip_components: 0

      - name: Upload bundle
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy.tar.gz"
          target: /var/www/app/
          strip_components: 0

      - name: Apply bundle on server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            echo "👤 Utilisateur du déploiement : ${{ secrets.VPS_USER }}"
            cd /var/www/app
            command -v rsync >/dev/null 2>&1 || { echo "rsync requis sur le serveur" >&2; exit 1; }
            test -f deploy/artifact-apply.sh || {
              echo "Missing deploy/artifact-apply.sh (scp path?)" >&2
              find /var/www/app -name 'artifact-apply.sh' 2>/dev/null || true
              exit 1
            }
            # Pas de chmod: inutile avec "bash" et souvent "Operation not permitted" si ownership strict
            bash deploy/artifact-apply.sh

      - name: Telegram notify success
        if: success()
        env:
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets missing, skipping notification."
            exit 0
          fi
          MESSAGE="✅ Deploy success
          Repo: ${REPO}
          Branch: ${TARGET_BRANCH}
          Actor: ${ACTOR}
          Run: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" >/dev/null

      - name: Telegram notify failure
        if: failure()
        env:
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets missing, skipping notification."
            exit 0
          fi
          MESSAGE="❌ Deploy failed
          Repo: ${REPO}
          Branch: ${TARGET_BRANCH}
          Actor: ${ACTOR}
          Run: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" >/dev/null
