# Afrue API — api.afrue.com
# Copy to the VPS then:
#   sudo nginx -t && sudo systemctl reload nginx

upstream api_backend {
    least_conn;
    server localhost:7001 weight=1 max_fails=3 fail_timeout=30s;
    # Ajoutez d'autres serveurs plus tard :
    server localhost:7002 weight=1 max_fails=3 fail_timeout=30s;
    server localhost:7003 weight=1 max_fails=3 fail_timeout=30s backup;
}

server {
    server_name api.afrue.com;

    # --- Security headers (API: transport + MIME, pas de CSP Next) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Si une réponse HTML fuit : rien à exécuter / rien à iframer
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Configuration de la compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        text/x-js;

    # Votre endpoint health existant via le load balancer
    location /health {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;

        # Headers pour le monitoring
        add_header X-Server-Port $upstream_addr;
        access_log /var/log/nginx/health_check.log;
    }

    # 10 fichiers × 10 Mo + marge
    client_max_body_size 110M;

    # Configuration principale de l'API
    location / {
        # Utilisation du load balancer
        proxy_pass http://api_backend;

        # Configuration du proxy
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts et cache bypass
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer configuration pour de meilleures performances
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Retry configuration
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # Endpoint de status Nginx (optionnel)
    location /nginx-status {
        access_log off;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601","server":"nginx"}';
        add_header Content-Type application/json;
        allow 127.0.0.1;
        deny all;
    }

    # Configuration des logs (utilise le format par défaut)
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log warn;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.afrue.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.afrue.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.afrue.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.afrue.com;
    return 404; # managed by Certbot
}
