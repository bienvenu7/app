# Afrue frontend — app.afrue.com
# Copy to the VPS (e.g. /etc/nginx/sites-available/app.afrue.com) then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name app.afrue.com www.app.afrue.com;

    client_max_body_size 20M;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    # CSP is set by Next middleware (per-request nonce, no unsafe-eval).
    # Do not add_header Content-Security-Policy here — dual policies break the nonce.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # C1 — do not proxy the API through the app origin
    location /v3 {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:1112;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.afrue.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.afrue.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.app.afrue.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = app.afrue.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app.afrue.com www.app.afrue.com;
    return 404; # managed by Certbot
}
