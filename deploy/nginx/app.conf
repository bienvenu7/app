# Afrue frontend — app.afrue.com
# Copy to the VPS (e.g. /etc/nginx/sites-available/app.afrue.com) then:
#   sudo nginx -t && sudo systemctl reload nginx

# --- Rate limiting ---
# These zones must sit in the http context, which is where sites-enabled is
# included from. They key on $binary_remote_addr, so nginx has to be the edge:
# behind a CDN, set_real_ip_from / real_ip_header must come first or every
# visitor collapses into a single key.
limit_req_zone $binary_remote_addr zone=afrue_all:10m rate=30r/s;

# Server actions carry a next-action header; page loads and static assets do
# not. nginx does not account empty keys, so the zones below only ever see
# actions. Sizing is constrained by the app itself: several hooks poll every
# 5 s, so one logged-in tab already spends around 36 actions per minute
# before the user touches anything.
map $http_next_action $afrue_action_key {
    default $binary_remote_addr;
    ""      "";
}
limit_req_zone $afrue_action_key zone=afrue_actions:10m rate=10r/s;

# /auth/login and /auth/register run no polling, only user-initiated calls, so
# they take a far tighter ceiling. This is an outer bound against credential
# stuffing, not a replacement for per-account lockout upstream: nginx can only
# key on IP and these corridors are heavily NATed. Tighten to 30r/m once the
# error log shows no legitimate request being limited.
limit_req_zone $afrue_action_key zone=afrue_auth:10m rate=60r/m;

limit_conn_zone $binary_remote_addr zone=afrue_conn:10m;

server {
    server_name app.afrue.com www.app.afrue.com;

    client_max_body_size 20M;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    # CSP is set by Next middleware (per-request nonce, no unsafe-eval).
    # Do not add_header Content-Security-Policy here — dual policies break the nonce.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Inherited by both proxied locations below
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # C1 — do not proxy the API through the app origin
    location /v3 {
        return 404;
    }

    # Login, registration, OTP and password reset all post their server action
    # to the page URL, so throttling these two paths covers every credential
    # flow. A regex location wins over the prefix one below, and static assets
    # stay under location / where the tight ceiling does not apply.
    location ~ ^/auth/(login|register)(/|$) {
        limit_req zone=afrue_all burst=100 nodelay;
        limit_req zone=afrue_auth burst=20 nodelay;
        limit_conn afrue_conn 100;

        proxy_pass http://127.0.0.1:1112;
    }

    location / {
        # burst absorbs a page load, roughly 22 requests, and the polling on
        # top of it; the rate is the sustained ceiling
        limit_req zone=afrue_all burst=100 nodelay;
        limit_req zone=afrue_actions burst=40 nodelay;
        limit_conn afrue_conn 100;

        proxy_pass http://127.0.0.1:1112;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.afrue.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.afrue.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.app.afrue.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = app.afrue.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app.afrue.com www.app.afrue.com;
    return 404; # managed by Certbot
}
